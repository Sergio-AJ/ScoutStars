<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-4">

    <h2 class="text-center mb-4">Comparador de jugadores</h2>

    <div class="d-flex justify-content-between mb-3">
        <a class="btn btn-primary btn-sm" href="/home">Inicio</a>
        <a class="btn btn-primary btn-sm" href="/home">Volver</a>
    </div>

    <!-- FILTROS -->
    <form method="GET" class="card p-3 mb-4 shadow-sm">

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Liga</label>
                <select name="liga_id" class="form-select" onchange="this.form.submit()">
                    <option value="">Todas</option>
                    {% for l in ligas %}
                        <option value="{{ l.id }}">{{ l.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Equipo</label>
                <select name="equipo_id" class="form-select" onchange="this.form.submit()">
                    <option value="">Todos</option>
                    {% for e in equipos %}
                        <option value="{{ e.id }}">{{ e.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

        </div>

    </form>

    <!-- COMPARACIÓN -->
    <form method="POST" class="card p-3 mb-4 shadow-sm">

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Jugador 1</label>
                <select name="jugador1" class="form-select">
                    {% for j in jugadores %}
                        <option value="{{ j.id }}">{{ j.nombre }} {{ j.apellido }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Jugador 2</label>
                <select name="jugador2" class="form-select">
                    {% for j in jugadores %}
                        <option value="{{ j.id }}">{{ j.nombre }} {{ j.apellido }}</option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <div class="text-center mt-3">
            <button type="submit" class="btn btn-success">
                Comparar
            </button>
        </div>

    </form>


{% if chart_url %}
    <div class="text-center mt-4">

    <h3 class="mb-3">Gráfico comparativo</h3>

    <img src="data:image/png;base64,{{ chart_url }}"
         class="img-fluid mx-auto d-block"
         style="max-width: 800px;">

    </div>
{% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
