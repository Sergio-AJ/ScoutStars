<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Crear Equipo</h2>
            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <form method="post">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input name="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ciudad</label>
                            <input name="ciudad" class="form-control">
                        </div>

                        <!-- LIGA -->
                        <div class="mb-3">

                            {% if liga %}

                                <label class="form-label">Liga</label>
                                <input type="text" class="form-control" value="{{ liga.nombre }}" disabled>
                                <input type="hidden" name="liga_id" value="{{ liga.id }}">

                            {% else %}

                                <label class="form-label">Liga</label>
                                <select name="liga_id" class="form-select" required>
                                    {% for liga in ligas %}
                                        <option value="{{ liga.id }}">{{ liga.nombre }}</option>
                                    {% endfor %}
                                </select>

                            {% endif %}

                        </div>

                        <!-- TEMPORADA -->
                        {% if temporadas %}
                        <div class="mb-4">

                            <label class="form-label">Temporada</label>

                            <select name="temporada_id" class="form-select" required>
                                {% for t in temporadas %}
                                    <option value="{{ t.id }}">{{ t.nombre }}</option>
                                {% endfor %}
                            </select>

                        </div>
                        {% endif %}

                        <div class="d-grid">
                            <button class="btn btn-success">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>

            </div>

            <div class="text-center mt-3">
                <a href="/ligas" class="btn btn-outline-secondary">
                    Volver al listado
                </a>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
