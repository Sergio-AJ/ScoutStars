<h2>Crear Equipo</h2>

<form method="post">
    Nombre: <input name="nombre" required><br>
    Ciudad: <input name="ciudad"><br>

    {% if liga %}
        <!-- Si ya estamos dentro de una liga -->
        <p>Liga: {{ liga.nombre }}</p>
        <input type="hidden" name="liga_id" value="{{ liga.id }}">
    {% else %}
        <!-- Si NO estamos dentro de una liga -->
        Liga:
        <select name="liga_id" required>
            {% for liga in ligas %}
                <option value="{{ liga.id }}">{{ liga.nombre }}</option>
            {% endfor %}
        </select>
    {% endif %}

    {% if temporadas %}
        Temporada:
        <select name="temporada_id">
            {% for t in temporadas %}
                <option value="{{ t.id }}">{{ t.nombre }}</option>
            {% endfor %}
        </select>
    {% endif %}

    <br>
    <button>Guardar</button>
</form>

<a href="/ligas">Volver al listado</a>
