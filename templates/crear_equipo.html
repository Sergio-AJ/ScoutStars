<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<h2>Crear Equipo</h2>

<form method="post">
    Nombre: <input name="nombre" required><br>
    Ciudad: <input name="ciudad"><br>

    {% if liga %}
        <!-- Si ya estamos dentro de una liga -->
        <p>Liga: {{ liga.nombre }}</p>
        <input type="hidden" name="liga_id" value="{{ liga.id }}">
    {% else %}
        <!-- Si NO estamos dentro de una liga -->
        Liga:
        <select name="liga_id" required>
            {% for liga in ligas %}
                <option value="{{ liga.id }}">{{ liga.nombre }}</option>
            {% endfor %}
        </select>
    {% endif %}

    {% if temporadas %}
        Temporada:
        <select name="temporada_id" required>
            {% for t in temporadas %}
                <option value="{{ t.id }}">{{ t.nombre }}</option>
            {% endfor %}
        </select>
    {% endif %}

    <br>
    <button>Guardar</button>
</form>

<a href="/ligas">Volver al listado</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
