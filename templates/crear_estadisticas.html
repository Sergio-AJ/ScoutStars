<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="text-center mb-4">
                <h2>Stats de {{ jugador.nombre_completo() }}</h2>
            </div>

            <div class="card shadow-sm">

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Temporada</label>
                            <select name="temporada_id" class="form-select">
                                {% for t in temporadas %}
                                    <option value="{{ t.id }}">{{ t.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row g-2">

                            <div class="col-md-6">
                                <input
                                    type="number"
                                    name="partidos"
                                    class="form-control"
                                    placeholder="Partidos"
                                    min="0"
                                    step="1"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <input
                                    type="number"
                                    name="puntos"
                                    class="form-control"
                                    placeholder="Puntos"
                                    min="0"
                                    step="1"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <input
                                    type="number"
                                    name="rebotes"
                                    class="form-control"
                                    placeholder="Rebotes"
                                    min="0"
                                    step="1"
                                    required>
                            </div>

                            <div class="col-md-6">
                                <input
                                    type="number"
                                    name="asistencias"
                                    class="form-control"
                                    placeholder="Asistencias"
                                    min="0"
                                    step="1"
                                    required>
                            </div>

                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
