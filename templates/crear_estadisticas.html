<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<h2>Stats de {{ jugador.nombre_completo() }}</h2>

<form method="POST">

    <label>Temporada:</label>
    <select name="temporada_id">
        {% for t in temporadas %}
            <option value="{{ t.id }}">{{ t.nombre }}</option>
        {% endfor %}
    </select>

    <input type="number" name="partidos" placeholder="Partidos" required>
    <input type="number" name="puntos" placeholder="Puntos" required>
    <input type="number" name="rebotes" placeholder="Rebotes" required>
    <input type="number" name="asistencias" placeholder="Asistencias" required>

    <button type="submit">Guardar</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
