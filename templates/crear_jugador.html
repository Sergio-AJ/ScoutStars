<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<h2>Crear Jugador</h2>
<form method="post">
    Nombre: <input name="nombre" required><br>
    Apellido: <input name="apellido" required><br>
    Número: <input type="number" name="numero" required><br>
    Posición: <input name="posicion"><br>
    Edad: <input type="number" name="edad"><br>
    Equipo:
    <select name="equipo_id" required>
        {% for equipo in equipos %}
        <option value="{{ equipo.id }}">{{ equipo.nombre }}</option>
        {% endfor %}
    </select><br>
    <button>Guardar</button>
</form>
<a href="/jugadores">Volver al listado</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
