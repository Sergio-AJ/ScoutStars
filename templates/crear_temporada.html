<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="text-center mb-4">
                <h2>Crear Temporada</h2>
            </div>

            <div class="card shadow-sm">

                <div class="card-body">

                    <form method="post">

                        <div class="mb-3">
                            <label class="form-label">Nombre de la temporada</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: 2025/2026" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Liga</label>
                            <select name="liga_id" class="form-select" required>
                                {% for liga in ligas %}
                                    <option value="{{ liga.id }}">{{ liga.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                Crear Temporada
                            </button>
                        </div>

                    </form>

                </div>

            </div>

            <div class="text-center mt-3">
                <a href="/temporadas">Volver</a>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
