<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<h2>Crear Temporada</h2>

<form method="post">

    Nombre de la temporada:
    <input type="text" name="nombre" placeholder="Ej: 2025/2026" required>
    <br><br>

    Liga:
    <select name="liga_id" required>
        {% for liga in ligas %}
            <option value="{{ liga.id }}">{{ liga.nombre }}</option>
        {% endfor %}
    </select>
    <br><br>

    <button type="submit">Crear Temporada</button>
</form>

<br>
<a href="/temporadas">Volver</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
