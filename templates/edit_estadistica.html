<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="text-center mb-4">
                <h2>Editar Estadísticas</h2>
            </div>

            <div class="card shadow-sm">

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <div class="text-center fw-bold">
                                {{ stat.jugador.nombre }} {{ stat.jugador.apellido }}
                            </div>
                            <div class="text-center text-muted">
                                Temporada: {{ stat.temporada.nombre }}
                            </div>
                        </div>

                        <div class="row g-2">

                            <div class="col-md-6">
                                <label class="form-label">Partidos</label>
                                <input type="number" name="partidos" class="form-control" value="{{ stat.partidos }}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Puntos</label>
                                <input type="number" name="puntos" class="form-control" value="{{ stat.puntos }}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Rebotes</label>
                                <input type="number" name="rebotes" class="form-control" value="{{ stat.rebotes }}">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Asistencias</label>
                                <input type="number" name="asistencias" class="form-control" value="{{ stat.asistencias }}">
                            </div>

                        </div>

                        <div class="d-grid mt-4">
                            <button class="btn btn-success">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>

            </div>

            <div class="text-center mt-3">
                <a href="/equipos/{{ stat.jugador.equipo_id }}/jugadores">
                    Volver
                </a>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
