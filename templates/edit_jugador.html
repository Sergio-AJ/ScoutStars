<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- TÍTULO -->
    <div class="text-center mb-4">
        <h2 class="fw-bold">Editar Jugador</h2>
    </div>

    <!-- FORMULARIO -->
    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <form method="post">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input 
                                type="text"
                                name="nombre"
                                value="{{ jugador.nombre }}"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input 
                                type="text"
                                name="apellido"
                                value="{{ jugador.apellido }}"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Número</label>
                            <input 
                                type="number"
                                name="numero"
                                value="{{ jugador.numero }}"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Posición</label>
                            <input 
                                type="text"
                                name="posicion"
                                value="{{ jugador.posicion }}"
                                class="form-control"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Edad</label>
                            <input 
                                type="number"
                                name="edad"
                                value="{{ jugador.edad }}"
                                class="form-control"
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Equipo</label>

                            <select name="equipo_id" class="form-select" required>

                                {% for equipo in equipos %}

                                <option value="{{ equipo.id }}"
                                    {% if equipo.id == jugador.equipo_id %}selected{% endif %}>

                                    {{ equipo.nombre }}

                                </option>

                                {% endfor %}

                            </select>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-primary">
                                Guardar cambios
                            </button>
                        </div>

                    </form>

                </div>

            </div>

            <!-- VOLVER -->
            <div class="text-center mt-3">
                <a href="/jugadores" class="btn btn-outline-secondary">
                    Volver al listado
                </a>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
