<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="text-center mb-4">
                <h2>Editar usuario</h2>
            </div>

            <div class="card shadow-sm">

                <div class="card-body">

                    <form method="post">

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input name="username" class="form-control" value="{{ user.username }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select name="role" class="form-select">
                                <option value="admin" {% if user.role=='admin' %}selected{% endif %}>admin</option>
                                <option value="entrenador" {% if user.role=='entrenador' %}selected{% endif %}>entrenador</option>
                                <option value="jugador" {% if user.role=='jugador' %}selected{% endif %}>jugador</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-success">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>

            </div>

            <div class="text-center mt-3">
                <a href="/users">Volver al listado</a>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
