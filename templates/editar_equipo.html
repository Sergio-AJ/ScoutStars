<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<h2>Editar equipo</h2>

<form method="post">

    Nombre: <input name="nombre" value="{{ equipo.nombre }}" required><br>

    Liga:
    <select name="liga_id">
        {% for liga in ligas %}
        <option value="{{ liga.id }}" {% if equipo.liga_id == liga.id %}selected{% endif %}>
            {{ liga.nombre }}
        </option>
        {% endfor %}
    </select><br>

    <button>Guardar</button>

</form>

<a href="/ligas">Volver al listado</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
