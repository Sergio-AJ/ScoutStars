<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <!-- TÍTULO -->
    <h2 class="text-center mb-4">{{ liga.nombre }} - Equipos</h2>

    <!-- NAV -->
    <div class="d-flex justify-content-center gap-3 mb-4 flex-wrap">

        <a href="/ligas" class="btn btn-outline-primary">
            Volver a ligas
        </a>

        <a href="/ligas/{{ liga.id }}/crear_equipo"
           class="btn btn-success">
            Crear nuevo equipo
        </a>

        <a href="/users" class="btn btn-outline-dark">
            Usuarios
        </a>

        <a href="/logout" class="btn btn-outline-danger">
            Cerrar sesión
        </a>

    </div>

    <!-- TABLA -->
    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Jugadores</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for equipo in equipos %}
                        <tr>

                            <td>{{ equipo.id }}</td>

                            <td>{{ equipo.nombre }}</td>

                            <td>{{ equipo.jugadores|length }}</td>

                            <td class="d-flex justify-content-center gap-2 flex-wrap">

                                <a href="/equipos/edit/{{ equipo.id }}"
                                   class="btn btn-sm btn-warning">
                                    Editar equipo
                                </a>

                                <a href="/equipos/delete/{{ equipo.id }}"
                                   class="btn btn-sm btn-danger">
                                    Borrar equipo
                                </a>

                                <a href="/equipos/{{ equipo.id }}/jugadores"
                                   class="btn btn-sm btn-primary">
                                    Ver jugadores
                                </a>

                            </td>

                        </tr>
                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
