<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<h2>Ligas</h2>

<a href="/ligas/crear">Crear nueva liga</a> | 
<a href="/users">Usuarios</a> | 
<a href="/home">Inicio</a>
<a href="/logout">Cerrar sesión</a>

<table border="1" cellpadding="5" cellspacing="0">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Ciudad</th>
        <th>Categoría</th>
        <th>Equipos</th>
        <th>Acciones</th>
    </tr>

    {% for liga in ligas %}
    <tr>
        <td>{{ liga.id }}</td>
        <td>{{ liga.nombre }}</td>
        <td>{{ liga.ciudad }}</td>
        <td>{{ liga.categoria }}</td>
        <td>{{ liga.equipos|length }}</td>
        <td>
            <a href="/ligas/{{ liga.id }}">Ver liga</a>
            <a href="/ligas/delete/{{ liga.id }}">Borrar liga</a>
        </td>
    </tr>
    {% endfor %}

</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
