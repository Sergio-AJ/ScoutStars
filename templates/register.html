<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">

    <style>
        .requirement {
            font-size: 14px;
        }

        .ok {
            color: green;
            text-decoration: line-through;
        }

        .bad {
            color: red;
        }
    </style>
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Alta de usuario</h2>
            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    {% if error %}
                    <div class="alert alert-danger text-center">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="post">

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>

                        <!-- REQUISITOS PASSWORD -->
                        <div class="mb-3">
                            <small class="d-block fw-bold mb-1">La contraseña debe tener:</small>

                            <div id="minLength" class="requirement bad">• Mínimo 8 caracteres</div>
                            <div id="upper" class="requirement bad">• Una mayúscula</div>
                            <div id="lower" class="requirement bad">• Una minúscula</div>
                            <div id="number" class="requirement bad">• Un número</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Rol</label>
                            <select name="role" class="form-select">
                                <option value="admin">admin</option>
                                <option value="entrenador">entrenador</option>
                                <option value="jugador">jugador</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-success">
                                Guardar
                            </button>
                        </div>

                    </form>

                </div>

            </div>

            <div class="text-center mt-3">
                <a href="/login" class="btn btn-link">
                    Volver al login
                </a>
            </div>

        </div>

    </div>

</div>

<script>
const password = document.getElementById("password");

const minLength = document.getElementById("minLength");
const upper = document.getElementById("upper");
const lower = document.getElementById("lower");
const number = document.getElementById("number");

password.addEventListener("input", function () {

    const value = password.value;

    // mínimo 8 caracteres
    if (value.length >= 8) {
        minLength.classList.add("ok");
        minLength.classList.remove("bad");
    } else {
        minLength.classList.add("bad");
        minLength.classList.remove("ok");
    }

    // mayúscula
    if (/[A-Z]/.test(value)) {
        upper.classList.add("ok");
        upper.classList.remove("bad");
    } else {
        upper.classList.add("bad");
        upper.classList.remove("ok");
    }

    // minúscula
    if (/[a-z]/.test(value)) {
        lower.classList.add("ok");
        lower.classList.remove("bad");
    } else {
        lower.classList.add("bad");
        lower.classList.remove("ok");
    }

    // número
    if (/[0-9]/.test(value)) {
        number.classList.add("ok");
        number.classList.remove("bad");
    } else {
        number.classList.add("bad");
        number.classList.remove("ok");
    }

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
