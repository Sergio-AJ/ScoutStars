<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-4">
        <h2>Temporada: {{ temporada.nombre }}</h2>
        <h5 class="text-muted">Liga: {{ temporada.liga.nombre }}</h5>
    </div>

    <div class="d-flex justify-content-between mb-4">
        <a class="btn btn-outline-secondary btn-sm" href="/temporadas">← Volver a temporadas</a>

        <a class="btn btn-primary btn-sm" href="/temporadas/{{ temporada.id }}/crear_equipo">
            Crear equipo
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <h5 class="mb-3">Equipos de esta temporada</h5>

            {% if equipos %}

                <div class="list-group">

                    {% for equipo in equipos %}
                        <div class="list-group-item d-flex justify-content-between align-items-center">

                            <span>{{ equipo.nombre }}</span>

                            <a class="btn btn-outline-primary btn-sm"
                               href="/equipos/{{ equipo.id }}/jugadores">
                                Ver jugadores
                            </a>

                        </div>
                    {% endfor %}

                </div>

            {% else %}

                <div class="text-muted text-center">
                    No hay equipos en esta temporada todavía.
                </div>

            {% endif %}

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
