<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<h2>Temporadas</h2>

<a href="/temporadas/crear">Crear nueva temporada</a>

<ul>
    {% for t in temporadas %}
        <li>
            <a href="/temporadas/{{ t.id }}">
                {{ t.nombre }} - {{ t.liga.nombre }}
            </a>
        </li>
    {% endfor %}
</ul>

<br>
<a href="/home">Inicio</a>
<a href="/ligas">Volver a ligas</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
