<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScoutStars</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-4">
        <h2>Temporadas</h2>
    </div>

    <div class="d-flex justify-content-end mb-3">
        <a class="btn btn-primary btn-sm" href="/temporadas/crear">
            Crear nueva temporada
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            {% if temporadas %}

                <div class="list-group">

                    {% for t in temporadas %}
                        <a href="/temporadas/{{ t.id }}"
                           class="list-group-item list-group-item-action d-flex justify-content-between">

                            <span>{{ t.nombre }}</span>
                            <span class="text-muted">{{ t.liga.nombre }}</span>

                        </a>
                    {% endfor %}

                </div>

            {% else %}

                <div class="text-center text-muted">
                    No hay temporadas creadas todavía.
                </div>

            {% endif %}

        </div>

    </div>

    <div class="mt-4 d-flex justify-content-between">
        <a class="btn btn-outline-secondary btn-sm" href="/home">Inicio</a>
        <a class="btn btn-outline-secondary btn-sm" href="/ligas">Volver a ligas</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
